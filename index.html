<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naresh App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Naresh</h1>
  </header>
  <main>
    <section class="hero">
      <h2>Welcome</h2>
      <p>This simple front-end demonstrates a basic interactive page.</p>
      <button id="changeTheme">Toggle Theme</button>
    </section>
    <section class="notes">
      <h2>Notes</h2>
      <form id="noteForm">
        <input type="text" id="noteInput" placeholder="Write a note" required />
        <button type="submit">Add</button>
      </form>
      <ul id="notesList"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
